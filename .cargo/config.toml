# Android link paths, relative to the repo root: the `-lgcc` stub
# android/scripts/build.sh writes (NDK r23+ has no libgcc) and the jniLibs
# libSDL2.so. Here rather than in RUSTFLAGS, whose changes rebuild every crate.
[target.aarch64-linux-android]
rustflags = ["-L", "target/ndk-libgcc-stub", "-L", "android/app/src/main/jniLibs/arm64-v8a"]

[target.armv7-linux-androideabi]
rustflags = ["-L", "target/ndk-libgcc-stub", "-L", "android/app/src/main/jniLibs/armeabi-v7a"]
