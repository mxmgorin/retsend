name: Linux

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
  release:
    types: [published]

# Named by hand: in a called workflow `github.workflow` is the caller's. Only a
# newer push to a pull request cancels a run.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-linux:
    # 22.04 over latest: its glibc 2.35 keeps the binary runnable on older
    # distros (glibc only guarantees backward compatibility).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates libsdl2-dev zip

      - name: Rust toolchain
        run: |
          set -eux
          rustup show
          rustc --version

      # System SDL2, dynamically linked — desktop distros all package it.
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          set -eux
          cargo build --release

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsend dist/
          strip dist/retsend || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: retsend-linux-x86_64
          path: dist/retsend

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          cd dist && zip -r ../retsend-linux-x86_64.zip .
          cd ..
          sha256sum retsend-linux-x86_64.zip > retsend-linux-x86_64.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            retsend-linux-x86_64.zip
            retsend-linux-x86_64.zip.sha256
