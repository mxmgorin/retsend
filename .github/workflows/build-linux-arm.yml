name: Linux ARM

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-aarch64:
    # Native arm64 runner (free for public repos) — no cross-compile, no qemu.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates libsdl2-dev

      - name: Rust toolchain
        run: |
          set -eux
          # rust-toolchain.toml pins the channel; rustup honors it.
          rustup show
          rustc --version

      - name: Build
        env:
          # CI performance build (kept out of Cargo.toml so local release
          # builds stay fast to compile). No -C target-cpu: the binary must
          # run on any ARMv8.0+ core (A35/A53/A55...).
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          set -eux
          cargo build --release

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsend dist/
          strip dist/retsend || true
          ls -la dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: dist/retsend

  build-armhf:
    # 32-bit handhelds. No armhf runners exist and arm64 hosts can't execute
    # AArch32, so this cross-compiles. Debian 11 sets the floor: its glibc 2.31
    # and SDL 2.0.14 are old enough for the CFW images these devices ship,
    # while a jammy build would demand GLIBC_2.34 and never start.
    runs-on: ubuntu-22.04
    container: debian:bullseye
    steps:
      - name: Install dependencies
        run: |
          set -eux
          # Debian keeps every architecture in one archive, so the armhf
          # sysroot is a plain apt install.
          dpkg --add-architecture armhf
          apt-get update
          # build-essential too: build scripts compile for the host.
          apt-get install -y --no-install-recommends \
            build-essential crossbuild-essential-armhf pkg-config \
            ca-certificates curl git

      - name: SDL2 for linking
        run: |
          set -eux
          # Debian 11 ships SDL 2.0.14, which predates SDL_RenderGeometry — the
          # call egui's canvas painter is built on. Unpack bookworm's armhf SDL
          # into a prefix of its own instead of pulling the suite in through
          # apt, which would drag a newer libc along and raise the glibc floor.
          pool=http://deb.debian.org/debian/pool/main/libs/libsdl2
          ver=2.26.5+dfsg-1
          for pkg in libsdl2-2.0-0 libsdl2-dev; do
            curl -fsSLO "$pool/${pkg}_${ver}_armhf.deb"
            dpkg -x "${pkg}_${ver}_armhf.deb" /opt/sdl2
          done
          ls -l /opt/sdl2/usr/lib/arm-linux-gnueabihf/libSDL2*

      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          set -eux
          # rust-toolchain.toml pins the channel; the first cargo call fetches it.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          RUSTFLAGS: "-L /opt/sdl2/usr/lib/arm-linux-gnueabihf"
        run: |
          set -eux
          rustup target add armv7-unknown-linux-gnueabihf
          cargo build --release --target armv7-unknown-linux-gnueabihf

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/armv7-unknown-linux-gnueabihf/release/retsend dist/
          ls -la dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-linux-armhf
          path: dist/retsend

  package:
    # Both binaries ride in one PortMaster zip; Retsend.sh picks at launch.
    needs: [build-aarch64, build-armhf]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin/armhf

      - name: Restore the executable bit
        # Artifacts travel as zips, which drop file modes.
        run: chmod +x bin/aarch64/retsend bin/armhf/retsend

      - name: Package for PortMaster
        run: |
          set -eux
          pm=portmaster-dist
          rm -rf "$pm"
          mkdir -p "$pm/retsend"
          # Only the launcher sits at the port root; everything else lives in
          # the retsend/ gamedir, matching installed-port layout.
          cp "portmaster/Retsend.sh" "$pm/"
          cp portmaster/port.json "$pm/retsend/"
          cp portmaster/gameinfo.xml "$pm/retsend/"
          cp portmaster/README.md "$pm/retsend/"
          cp portmaster/screenshot.png "$pm/retsend/"
          cp -r portmaster/retsend/. "$pm/retsend/"
          rm -f "$pm/retsend/.gitkeep"
          cp bin/aarch64/retsend "$pm/retsend/retsend.aarch64"
          cp bin/armhf/retsend "$pm/retsend/retsend.armhf"
          chmod +x "$pm/Retsend.sh"
          ls -laR "$pm"

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-portmaster
          path: portmaster-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          cd portmaster-dist && zip -r ../retsend-portmaster.zip .
          cd ..
          sha256sum retsend-portmaster.zip > retsend-portmaster.zip.sha256
          (cd bin/aarch64 && zip ../../retsend-linux-aarch64.zip retsend)
          sha256sum retsend-linux-aarch64.zip > retsend-linux-aarch64.zip.sha256
          (cd bin/armhf && zip ../../retsend-linux-armhf.zip retsend)
          sha256sum retsend-linux-armhf.zip > retsend-linux-armhf.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-portmaster.zip
            retsend-portmaster.zip.sha256
            retsend-linux-aarch64.zip
            retsend-linux-aarch64.zip.sha256
            retsend-linux-armhf.zip
            retsend-linux-armhf.zip.sha256
