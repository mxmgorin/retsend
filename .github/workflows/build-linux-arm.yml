name: Linux ARM

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]

permissions:
  contents: write

env:
  # The oldest userland we target: OnionOS (Miyoo Mini Plus) is glibc 2.28, ArkOS
  # 2.30. zig supplies stubs for it, so this is the whole floor decision — no
  # archived distro to build in. Keep in step with tools/arm/glibc-floor.
  GLIBC_FLOOR: "2.28"
  ZIG_VERSION: "0.15.2"
  ZIGBUILD_VERSION: "0.23.0"
  SDL_VERSION: "2.26.5+dfsg-1"

jobs:
  build:
    # One build per arch, shared by every package below, so the binary in the
    # PortMaster zip is the same file the OnionOS zip ships.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            deb_arch: armhf
            libdir: arm-linux-gnueabihf
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            libdir: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          set -eux
          # rust-toolchain.toml pins the channel; rustup honors it.
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: zig and cargo-zigbuild
        run: |
          set -eux
          curl --retry 5 -fsSL \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          curl --retry 5 -fsSL \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              "cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild"

      - name: SDL2 for linking
        run: |
          set -eux
          # Only its symbols matter; the device loads its own SDL2. Ubuntu's is
          # 2.0.20, which predates SDL_RenderGeometry, so take Debian's.
          pool=http://deb.debian.org/debian/pool/main/libs/libsdl2
          mkdir -p /opt/sdl2
          for pkg in libsdl2-2.0-0 libsdl2-dev; do
            curl --retry 5 -fsSLO "$pool/${pkg}_${SDL_VERSION}_${{ matrix.deb_arch }}.deb"
            dpkg -x "${pkg}_${SDL_VERSION}_${{ matrix.deb_arch }}.deb" /opt/sdl2
          done
          ls -l /opt/sdl2/usr/lib/${{ matrix.libdir }}/libSDL2*

      - name: Build
        env:
          # CI performance build; kept out of Cargo.toml so local release builds
          # stay fast to compile. No -C target-cpu: any ARMv7/ARMv8.0+ core.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          # No linker override: cargo-zigbuild points the linker and cc at zig,
          # and a -C linker of our own would opt out of it.
          # --allow-shlib-undefined: this libSDL2 pulls in X11/wayland/alsa/gbm,
          # which the sysroot lacks and we never call.
          RUSTFLAGS: "-L /opt/sdl2/usr/lib/${{ matrix.libdir }} -C link-arg=-Wl,--allow-shlib-undefined"
        run: |
          set -eux
          cargo zigbuild --release --target ${{ matrix.target }}.$GLIBC_FLOOR

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/${{ matrix.target }}/release/retsend dist/
          ls -la dist/

      - name: Check the glibc floor
        run: |
          set -eux
          # Above the floor the loader refuses the binary on the device, which is
          # how this port broke the first time. Fail here instead of there.
          newer=$(readelf -V dist/retsend | grep -o 'GLIBC_2\.[0-9]*' | sort -uV \
            | awk -F. -v f="${GLIBC_FLOOR#2.}" '$2 > f' | tr '\n' ' ')
          if [ -n "$newer" ]; then
            echo "binary requires $newer; the floor is GLIBC_$GLIBC_FLOOR" >&2
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-linux-${{ matrix.arch }}
          path: dist/retsend

  portmaster:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin/armhf

      - name: Package for PortMaster
        run: |
          set -eux
          pm=portmaster-dist
          rm -rf "$pm"
          mkdir -p "$pm/retsend"
          # Only the launcher sits at the port root; everything else lives in
          # the retsend/ gamedir, matching installed-port layout.
          cp "portmaster/Retsend.sh" "$pm/"
          cp portmaster/port.json "$pm/retsend/"
          cp portmaster/gameinfo.xml "$pm/retsend/"
          cp portmaster/README.md "$pm/retsend/"
          cp portmaster/screenshot.png "$pm/retsend/"
          cp -r portmaster/retsend/. "$pm/retsend/"
          rm -f "$pm/retsend/.gitkeep"
          # Artifacts travel as zips, which drop file modes.
          install -m 755 bin/aarch64/retsend "$pm/retsend/retsend.aarch64"
          install -m 755 bin/armhf/retsend "$pm/retsend/retsend.armhf"
          chmod +x "$pm/Retsend.sh"
          ls -laR "$pm"

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-portmaster
          path: portmaster-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd portmaster-dist && zip -r ../retsend-portmaster.zip .)
          sha256sum retsend-portmaster.zip > retsend-portmaster.zip.sha256
          (cd bin/aarch64 && zip ../../retsend-linux-aarch64.zip retsend)
          sha256sum retsend-linux-aarch64.zip > retsend-linux-aarch64.zip.sha256
          (cd bin/armhf && zip ../../retsend-linux-armhf.zip retsend)
          sha256sum retsend-linux-armhf.zip > retsend-linux-armhf.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-portmaster.zip
            retsend-portmaster.zip.sha256
            retsend-linux-aarch64.zip
            retsend-linux-aarch64.zip.sha256
            retsend-linux-armhf.zip
            retsend-linux-armhf.zip.sha256

  onionos:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=onionos-dist
          rm -rf "$pkg"
          mkdir -p "$pkg"
          # The zip mirrors the card, so it unzips at the SD root and the app
          # lands in App/Retsend/ where MainUI looks for it.
          cp -r onionos/App "$pkg/"
          cp onionos/README.md "$pkg/App/Retsend/"
          install -m 755 bin/retsend "$pkg/App/Retsend/retsend"
          chmod 755 "$pkg/App/Retsend/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-onionos
          path: onionos-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd onionos-dist && zip -r ../retsend-onionos.zip .)
          sha256sum retsend-onionos.zip > retsend-onionos.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-onionos.zip
            retsend-onionos.zip.sha256

  spruce:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=spruce-dist
          app=$pkg/App/Retsend
          rm -rf "$pkg"
          mkdir -p "$app"
          # spruce reads App/ as OnionOS does; what differs is the launcher and a
          # config.json carrying the device list and the Simple Mode flag. The
          # icon and the bundled SDL2 come from the one tree rather than a second
          # copy that would drift from it.
          cp spruce/App/Retsend/config.json spruce/App/Retsend/launch.sh "$app/"
          cp spruce/README.md "$app/"
          cp onionos/App/Retsend/icon.png "$app/"
          cp -r onionos/App/Retsend/lib "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-spruceos
          path: spruce-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd spruce-dist && zip -r ../retsend-spruceos.zip .)
          sha256sum retsend-spruceos.zip > retsend-spruceos.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-spruceos.zip
            retsend-spruceos.zip.sha256

  spruce-aarch64:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=spruce-aarch64-dist
          app=$pkg/App/Retsend
          rm -rf "$pkg"
          mkdir -p "$app/retsend"
          # The port as an app: its launcher beside the retsend/ gamedir.
          cp spruce-aarch64/App/Retsend/config.json spruce-aarch64/App/Retsend/launch.sh "$app/"
          cp onionos/App/Retsend/icon.png "$app/"
          cp portmaster/Retsend.sh "$app/"
          cp portmaster/port.json portmaster/gameinfo.xml portmaster/README.md \
            portmaster/screenshot.png "$app/retsend/"
          cp -r portmaster/retsend/. "$app/retsend/"
          rm -f "$app/retsend/.gitkeep"
          install -m 755 bin/retsend "$app/retsend/retsend.aarch64"
          chmod 755 "$app/launch.sh" "$app/Retsend.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-spruceos-aarch64
          path: spruce-aarch64-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd spruce-aarch64-dist && zip -r ../retsend-spruceos-aarch64.zip .)
          sha256sum retsend-spruceos-aarch64.zip > retsend-spruceos-aarch64.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-spruceos-aarch64.zip
            retsend-spruceos-aarch64.zip.sha256

  allium:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=allium-dist
          app=$pkg/Apps/Retsend.pak
          rm -rf "$pkg"
          mkdir -p "$app"
          # The same device as the OnionOS package, a different launcher: Allium
          # reads Apps/, and only a folder ending in .pak is an app to it. The
          # bundled SDL2 comes from the one tree rather than a second copy that
          # would drift from it.
          cp allium/Apps/Retsend.pak/config.json allium/Apps/Retsend.pak/launch.sh "$app/"
          # Carried, not installed: copied into Roms/PORTS it puts the app in the
          # Games tab, handing over to this one install.
          cp -r allium/Apps/Retsend.pak/ports "$app/"
          chmod 755 "$app/ports/Retsend.port/launch.sh"
          cp allium/README.md "$app/"
          # Allium draws app icons on its own dark list, so it gets the plated
          # icon rather than the transparent glyph OnionOS themes want.
          cp resources/icon.png "$app/"
          cp -r onionos/App/Retsend/lib "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-allium
          path: allium-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd allium-dist && zip -r ../retsend-allium.zip .)
          sha256sum retsend-allium.zip > retsend-allium.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-allium.zip
            retsend-allium.zip.sha256

  muos:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin

      - name: Assemble the application folder
        run: |
          set -eux
          pkg=muos-dist
          app=$pkg/Retsend
          rm -rf "$pkg"
          mkdir -p "$app"
          # Archive Manager unpacks a .muxapp into MUOS/application/, so the
          # folder at the archive root is the installed app.
          cp muos/mux_launch.sh "$app/"
          cp muos/README.md "$app/"
          # The glyph the app list falls back to, named after the ICON header.
          # 24x24, the size themes cut theirs to: muOS draws it at native size.
          cp -r muos/glyph "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/mux_launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-muos
          path: muos-dist

      - name: Pack for release
        if: github.event_name == 'release'
        run: |
          set -eux
          # .muxapp is a zip; the extension is what Archive Manager dispatches on.
          (cd muos-dist && zip -r ../retsend-muos.muxapp Retsend)
          sha256sum retsend-muos.muxapp > retsend-muos.muxapp.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-muos.muxapp
            retsend-muos.muxapp.sha256
