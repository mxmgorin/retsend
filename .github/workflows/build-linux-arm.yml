name: Linux ARM

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]

permissions:
  contents: write

env:
  # Oldest userland targeted (OnionOS); zig links against its stubs.
  # Keep in step with tools/arm/glibc-floor.
  GLIBC_FLOOR: "2.28"
  ZIG_VERSION: "0.15.2"
  ZIGBUILD_VERSION: "0.23.0"
  SDL_VERSION: "2.26.5+dfsg-1"

jobs:
  build:
    # One binary per arch, shared by every package below.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            deb_arch: armhf
            libdir: arm-linux-gnueabihf
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            libdir: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          set -eux
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: zig and cargo-zigbuild
        run: |
          set -eux
          curl --retry 5 -fsSL \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          curl --retry 5 -fsSL \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
              "cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild"

      - name: SDL2 for linking
        run: |
          set -eux
          # Link-time only; Debian's, as Ubuntu's 2.0.20 lacks SDL_RenderGeometry.
          pool=http://deb.debian.org/debian/pool/main/libs/libsdl2
          mkdir -p /opt/sdl2
          for pkg in libsdl2-2.0-0 libsdl2-dev; do
            curl --retry 5 -fsSLO "$pool/${pkg}_${SDL_VERSION}_${{ matrix.deb_arch }}.deb"
            dpkg -x "${pkg}_${SDL_VERSION}_${{ matrix.deb_arch }}.deb" /opt/sdl2
          done
          ls -l /opt/sdl2/usr/lib/${{ matrix.libdir }}/libSDL2*

      - name: Build
        env:
          # Kept out of Cargo.toml so local release builds stay fast.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          # This libSDL2 needs X11/wayland/alsa/gbm, absent from the sysroot and
          # never called.
          RUSTFLAGS: "-L /opt/sdl2/usr/lib/${{ matrix.libdir }} -C link-arg=-Wl,--allow-shlib-undefined"
        run: |
          set -eux
          cargo zigbuild --release --target ${{ matrix.target }}.$GLIBC_FLOOR

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/${{ matrix.target }}/release/retsend dist/
          ls -la dist/

      - name: Check the glibc floor
        run: |
          set -eux
          # A symbol above the floor makes the device's loader refuse the binary.
          newer=$(readelf -V dist/retsend | grep -o 'GLIBC_2\.[0-9]*' | sort -uV \
            | awk -F. -v f="${GLIBC_FLOOR#2.}" '$2 > f' | tr '\n' ' ')
          if [ -n "$newer" ]; then
            echo "binary requires $newer; the floor is GLIBC_$GLIBC_FLOOR" >&2
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-linux-${{ matrix.arch }}
          path: dist/retsend

  portmaster:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin/aarch64

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin/armhf

      - name: Package for PortMaster
        run: |
          set -eux
          pm=portmaster-dist
          rm -rf "$pm"
          mkdir -p "$pm/retsend"
          # Installed-port layout: the launcher at the root, the rest in retsend/.
          cp packaging/portmaster/Retsend.sh "$pm/"
          cp packaging/portmaster/port.json "$pm/retsend/"
          cp packaging/portmaster/gameinfo.xml "$pm/retsend/"
          cp packaging/portmaster/README.md "$pm/retsend/"
          cp packaging/portmaster/screenshot.png "$pm/retsend/"
          cp -r packaging/portmaster/retsend/. "$pm/retsend/"
          rm -f "$pm/retsend/.gitkeep"
          # Artifacts travel as zips, which drop file modes.
          install -m 755 bin/aarch64/retsend "$pm/retsend/retsend.aarch64"
          install -m 755 bin/armhf/retsend "$pm/retsend/retsend.armhf"
          chmod +x "$pm/Retsend.sh"
          ls -laR "$pm"

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-portmaster
          path: portmaster-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd portmaster-dist && zip -r ../retsend-portmaster.zip .)
          sha256sum retsend-portmaster.zip > retsend-portmaster.zip.sha256
          (cd bin/aarch64 && zip ../../retsend-linux-aarch64.zip retsend)
          sha256sum retsend-linux-aarch64.zip > retsend-linux-aarch64.zip.sha256
          (cd bin/armhf && zip ../../retsend-linux-armhf.zip retsend)
          sha256sum retsend-linux-armhf.zip > retsend-linux-armhf.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-portmaster.zip
            retsend-portmaster.zip.sha256
            retsend-linux-aarch64.zip
            retsend-linux-aarch64.zip.sha256
            retsend-linux-armhf.zip
            retsend-linux-armhf.zip.sha256

  onionos:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=onionos-dist
          rm -rf "$pkg"
          mkdir -p "$pkg"
          # Mirrors the card: unzipped at the SD root.
          cp -r packaging/miyoo/onionos/App "$pkg/"
          cp packaging/miyoo/onionos/README.md "$pkg/App/Retsend/"
          cp packaging/miyoo/shared/icon.png "$pkg/App/Retsend/"
          cp -r packaging/miyoo/shared/lib "$pkg/App/Retsend/"
          install -m 755 bin/retsend "$pkg/App/Retsend/retsend"
          chmod 755 "$pkg/App/Retsend/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-onionos
          path: onionos-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd onionos-dist && zip -r ../retsend-onionos.zip .)
          sha256sum retsend-onionos.zip > retsend-onionos.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-onionos.zip
            retsend-onionos.zip.sha256

  spruce-armhf:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=spruce-armhf-dist
          app=$pkg/App/Retsend
          rm -rf "$pkg"
          mkdir -p "$app"
          # The OnionOS layout with spruce's launcher and config.json.
          cp packaging/miyoo/spruceos/App/Retsend/config.json packaging/miyoo/spruceos/App/Retsend/launch.sh "$app/"
          cp packaging/miyoo/spruceos/README.md "$app/"
          cp packaging/miyoo/shared/icon.png "$app/"
          cp -r packaging/miyoo/shared/lib "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-spruceos-armhf
          path: spruce-armhf-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd spruce-armhf-dist && zip -r ../retsend-spruceos-armhf.zip .)
          sha256sum retsend-spruceos-armhf.zip > retsend-spruceos-armhf.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-spruceos-armhf.zip
            retsend-spruceos-armhf.zip.sha256

  spruce-aarch64:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=spruce-aarch64-dist
          app=$pkg/App/Retsend
          rm -rf "$pkg"
          mkdir -p "$app/retsend"
          # The PortMaster port as an app, run by spruce's ports launcher.
          cp packaging/spruce/App/Retsend/config.json packaging/spruce/App/Retsend/launch.sh "$app/"
          cp packaging/miyoo/shared/icon.png "$app/"
          cp packaging/portmaster/Retsend.sh "$app/"
          cp packaging/portmaster/port.json packaging/portmaster/gameinfo.xml \
            packaging/portmaster/README.md packaging/portmaster/screenshot.png "$app/retsend/"
          cp -r packaging/portmaster/retsend/. "$app/retsend/"
          rm -f "$app/retsend/.gitkeep"
          install -m 755 bin/retsend "$app/retsend/retsend.aarch64"
          chmod 755 "$app/launch.sh" "$app/Retsend.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-spruceos-aarch64
          path: spruce-aarch64-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd spruce-aarch64-dist && zip -r ../retsend-spruceos-aarch64.zip .)
          sha256sum retsend-spruceos-aarch64.zip > retsend-spruceos-aarch64.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-spruceos-aarch64.zip
            retsend-spruceos-aarch64.zip.sha256

  nextui:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=nextui-dist
          rm -rf "$pkg"
          mkdir -p "$pkg"
          # The tg5040 pak holds the app; the tg5050 one hands over to it.
          cp -r packaging/nextui/Tools "$pkg/"
          install -m 755 bin/retsend "$pkg/Tools/tg5040/Retsend.pak/retsend"
          chmod 755 "$pkg"/Tools/*/Retsend.pak/launch.sh
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-nextui
          path: nextui-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd nextui-dist && zip -r ../retsend-nextui.zip .)
          sha256sum retsend-nextui.zip > retsend-nextui.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-nextui.zip
            retsend-nextui.zip.sha256

  allium:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-armhf
          path: bin

      - name: Assemble the card layout
        run: |
          set -eux
          pkg=allium-dist
          app=$pkg/Apps/Retsend.pak
          rm -rf "$pkg"
          mkdir -p "$app"
          # Allium only takes a folder ending in .pak as an app.
          cp packaging/miyoo/allium/Apps/Retsend.pak/config.json packaging/miyoo/allium/Apps/Retsend.pak/launch.sh "$app/"
          # Optional: copied into Roms/PORTS, it lists the app in the Games tab.
          cp -r packaging/miyoo/allium/Apps/Retsend.pak/ports "$app/"
          chmod 755 "$app/ports/Retsend.port/launch.sh"
          cp packaging/miyoo/allium/README.md "$app/"
          # Allium's list wants the plated icon, not OnionOS's transparent glyph.
          cp resources/icon.png "$app/"
          cp -r packaging/miyoo/shared/lib "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-allium
          path: allium-dist

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          (cd allium-dist && zip -r ../retsend-allium.zip .)
          sha256sum retsend-allium.zip > retsend-allium.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-allium.zip
            retsend-allium.zip.sha256

  muos:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retsend-linux-aarch64
          path: bin

      - name: Assemble the application folder
        run: |
          set -eux
          pkg=muos-dist
          app=$pkg/Retsend
          rm -rf "$pkg"
          mkdir -p "$app"
          # Archive Manager unpacks the root folder into MUOS/application/.
          cp packaging/muos/mux_launch.sh "$app/"
          cp packaging/muos/README.md "$app/"
          # Named after the ICON header; 24x24, as muOS draws it unscaled.
          cp -r packaging/muos/glyph "$app/"
          install -m 755 bin/retsend "$app/retsend"
          chmod 755 "$app/mux_launch.sh"
          ls -laR "$pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsend-muos
          path: muos-dist

      - name: Pack for release
        if: github.event_name == 'release'
        run: |
          set -eux
          # .muxapp is a zip; the extension is what Archive Manager dispatches on.
          (cd muos-dist && zip -r ../retsend-muos.muxapp Retsend)
          sha256sum retsend-muos.muxapp > retsend-muos.muxapp.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsend-muos.muxapp
            retsend-muos.muxapp.sha256
