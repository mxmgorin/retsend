name: Nightly

# One rolling pre-release on the `nightly` tag, rebuilt from main once a day.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this commit is already the nightly or has not passed CI"
        type: boolean
        default: false
  schedule:
    - cron: "41 1 * * *"

permissions:
  contents: write
  actions: read

# Never two at once: they would race for the tag.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changed:
    # Forks must not publish nightlies.
    if: github.repository == 'mxmgorin/retsend'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)" >> "$GITHUB_OUTPUT"
          # The published nightly records its commit, so a quiet day costs nothing.
          last="$(gh release view nightly --json body --jq .body 2>/dev/null \
                  | sed -n 's/^commit: //p' || true)"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced: rebuilding $sha"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$sha" = "$last" ]; then
            echo "no commits since the last nightly ($last)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            # A red or unfinished CI waits for a green commit on a later night.
            ci="$(gh run list --workflow ci.yml --commit "$sha" --event push \
                  --json conclusion --jq '.[0].conclusion // ""')"
            if [ "$ci" = "success" ]; then
              echo "building $sha (last was ${last:-none})"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "skipping $sha: CI is '${ci:-not finished}'"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  linux:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-linux.yml

  linux-arm:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-linux-arm.yml

  android:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-android.yml
    # The signing key, so a nightly APK installs over the one already there.
    secrets: inherit

  vita:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-vita.yml

  publish:
    needs: [changed, linux, linux-arm, android, vita]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: art

      # Asset names match the release ones. Artifacts drop file modes, so the
      # launchers and binaries get theirs back before zipping.
      - name: Package
        run: |
          set -eux
          find art -type f \( -name '*.sh' -o -name retsend -o -name 'retsend.aarch64' \
            -o -name 'retsend.armhf' \) -exec chmod 755 {} +
          mkdir -p out
          for a in retsend-linux-x86_64 retsend-linux-aarch64 retsend-linux-armhf \
                   retsend-portmaster retsend-onionos retsend-allium retsend-spruceos-armhf \
                   retsend-spruceos-aarch64 retsend-nextui; do
            (cd "art/$a" && zip -r "../../out/$a.zip" .)
          done
          (cd art/retsend-muos && zip -r ../../out/retsend-muos.muxapp Retsend)
          cp art/retsend-android-arm64/*.apk out/retsend-android-arm64.apk
          cp art/retsend-android-armv7/*.apk out/retsend-android-armv7.apk
          cp art/retsend-vita/*.vpk out/retsend-vita.vpk
          cd out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      # The tag follows main rather than accumulating one tag per night.
      - name: Move the nightly tag
        run: |
          set -eux
          git tag -f nightly "${{ needs.changed.outputs.sha }}"
          git push origin nightly --force

      # The releases page orders by creation, so a fresh release keeps it on top.
      - name: Drop the previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes || true

      # Drafted until every asset is up, so nobody downloads half a release.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly ${{ needs.changed.outputs.date }} (${{ needs.changed.outputs.short }})
          draft: true
          prerelease: true
          make_latest: false
          files: out/*
          body: |
            Untested automated build from the latest commit on main.

            commit: ${{ needs.changed.outputs.sha }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit nightly --draft=false
