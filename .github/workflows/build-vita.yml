name: PS Vita

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
  release:
    types: [published]

# Named by hand: in a called workflow `github.workflow` is the caller's. Only a
# newer push to a pull request cancels a run.
concurrency:
  group: build-vita-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  # Tier 3: std is built from source, which needs nightly. Dated, so a nightly
  # regression can't break the build.
  VITA_TOOLCHAIN: "nightly-2026-05-31"
  CARGO_VITA_VERSION: "0.2.2"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: VitaSDK and its SDL2
        run: |
          set -eux
          # The bootstrap creates the directory itself and refuses an existing one.
          export VITASDK="$HOME/vitasdk"
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          /tmp/vdpm/bootstrap-vitasdk.sh --install-dir "$VITASDK"
          yes | "$VITASDK/bin/vdpm" install sdl2
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain and cargo-vita
        run: |
          set -eux
          rustup toolchain install "$VITA_TOOLCHAIN" --profile minimal --component rust-src
          cargo install cargo-vita --version "$CARGO_VITA_VERSION" --locked

      - name: Build
        env:
          CARGO_PROFILE_VITA_LTO: "fat"
          CARGO_PROFILE_VITA_CODEGEN_UNITS: "1"
        run: |
          set -eux
          packaging/vita/build.sh
          cp target/armv7-sony-vita-newlibeabihf/vita/retsend.vpk retsend-vita.vpk
          sha256sum retsend-vita.vpk > retsend-vita.vpk.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: retsend-vita
          path: retsend-vita.vpk

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            retsend-vita.vpk
            retsend-vita.vpk.sha256
