name: Android

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
  release:
    types: [published]

# Named by hand: in a called workflow `github.workflow` is the caller's. Only a
# newer push to a pull request cancels a run.
concurrency:
  group: build-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018" # r27c
  ANDROID_API: "24"
  CARGO_NET_RETRY: "10"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            name: arm64
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            name: armv7
    env:
      ABI: ${{ matrix.abi }}
      RUST_TARGET: ${{ matrix.rust_target }}
      APK: retsend-android-${{ matrix.name }}.apk
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + platform + build-tools
        run: |
          set -eux
          # Google's servers, with no retry of their own.
          for attempt in 1 2 3; do
            sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" && break
            [ "$attempt" -lt 3 ] && sleep 20 || exit 1
          done
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          set -eux
          rustup show
          rustup target add "${RUST_TARGET}"

      # Dependencies built once and reused; saved from main only, so a pull
      # request restores it without spending the quota on its own copy.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # sync-sdl.sh needs the sdl2-sys source for the Java glue and libSDL2.so.
      - name: Fetch crates
        run: cargo fetch

      - name: Sync SDL glue + build libSDL2.so
        run: bash android/scripts/sync-sdl.sh "${ABI}"

      - name: Build Rust cdylib
        env:
          # Kept out of Cargo.toml so local release builds stay fast.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          set -eux
          # NDK r23+ has no libgcc, which rustc still links; see .cargo/config.toml.
          mkdir -p target/ndk-libgcc-stub
          echo "INPUT(-lunwind)" > target/ndk-libgcc-stub/libgcc.a
          cargo ndk -t "${ABI}" -P "${ANDROID_API}" \
            -o android/app/src/main/jniLibs build --release

      # A stable key keeps `adb install -r` updating in place across releases.
      # Without the secret (a fork) fall back to an ephemeral one so the build
      # still runs. No `set -x` here: keep the base64 out of the logs.
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.RETSEND_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "Using keystore from RETSEND_KEYSTORE_BASE64 (stable signature)."
          else
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=retsend,O=retsend,C=US"
            echo "::warning::RETSEND_KEYSTORE_BASE64 not set; using an ephemeral key (APKs won't update in place)."
          fi

      - name: Assemble release APK
        env:
          RETSEND_KEYSTORE: release.keystore
          RETSEND_KEYSTORE_PASS: ${{ secrets.RETSEND_KEYSTORE_PASS || 'android' }}
          RETSEND_KEY_ALIAS: ${{ secrets.RETSEND_KEY_ALIAS || 'androiddebugkey' }}
          RETSEND_KEY_PASS: ${{ secrets.RETSEND_KEY_PASS || 'android' }}
        run: |
          set -eux
          cd android
          ./gradlew --no-daemon -Pabi="${ABI}" assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Stage the APK
        run: |
          set -eux
          cp android/app/build/outputs/apk/release/app-release.apk "${APK}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: retsend-android-${{ matrix.name }}
          path: ${{ env.APK }}

      - name: Checksum
        if: github.event_name == 'release'
        run: sha256sum "${APK}" > "${APK}.sha256"

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
