[package]
name = "retsend"
version = "1.0.0"
edition = "2021"
authors = ["mxmgorin"]
license = "GPL-3.0"
description = "LocalSend client for retro handhelds (SDL2 + egui)"
repository = "https://github.com/mxmgorin/retsend"

# `cdylib`: the `libretsend.so` SDL's Android shell loads. `lib`: for main.rs
# and the tests.
[lib]
name = "retsend"
crate-type = ["lib", "cdylib"]

[features]
default = ["software-render"]
sdl2-bundled = ["sdl2/bundled"]
sdl2-static-link = ["sdl2/static-link"]
# The SDL-renderer fallback. Needs SDL_RenderGeometry (2.0.18+): a build for an
# older userland drops it, or the binary won't load.
software-render = ["egui-sdl2/canvas-backend"]

# Slow optimizations are CI-only (CARGO_PROFILE_RELEASE_*), so local release
# builds stay fast.
[profile.release]
strip = true
debug-assertions = false
overflow-checks = false

# vita-elf-create needs the relocations `strip` drops; cargo-vita strips after.
[profile.vita]
inherits = "release"
strip = false

[dependencies]
sdl2 = { version = "0.38", default-features = false }
egui-sdl2 = { version = "0.12.1", default-features = false, features = ["glow-backend"] }
# Must match egui_glow's glow: we hand it our glow::Context.
glow = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
log = "0.4"
env_logger = "0.11"
png = "0.18"
# Certificate verification is off: LocalSend trusts the fingerprint, not a CA.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# A floor, not a pin: earlier 0.23 releases carry RUSTSEC-2024-0399 and
# RUSTSEC-2026-0285.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# No default features: its `pem` pins pem 3 against our pem 4.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# ureq's client-auth types take PEM only; the DER constructor's KeyKind is private.
pem = "4"
sha2 = "0.11"
# SO_REUSEADDR/SO_REUSEPORT before bind, which std can't set: shares UDP 53317
# with the official app on one machine.
socket2 = { version = "0.6", features = ["all"] }
# Session ids, tokens and fingerprints; no uuid/rand needed.
getrandom = "0.4"
# `sigwait`, so a launcher's SIGTERM shuts down cleanly.
libc = "0.2"

# Android has no stderr: logs go to logcat.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# VitaSDK's static SDL2: only its pkg-config file lists the Sce*_stub libraries.
[target.'cfg(target_os = "vita")'.dependencies]
sdl2 = { version = "0.38", default-features = false, features = ["use-pkgconfig"] }

[package.metadata.vita]
title_id = "RTSD00001"
title_name = "Retsend"
assets = "packaging/vita/assets"
# Not safe mode (cargo-vita's default `-s`): a safe app may not listen on a port.
vita_make_fself_flags = []

[package.metadata.vita.profile.vita]
strip_symbols = true
